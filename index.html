<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FONBET</title>
    <link rel="icon" href="./game_icon.png?v=1" type="image/png" />
    
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/hack-font@3/build/web/hack.css"
    />
    <style>
      :root {
        color-scheme: dark;
        font-family: "Hack", ui-monospace, "Cascadia Code", "SF Mono", Menlo,
          Consolas, monospace;
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        color: #edf3ff;
        background: #050814;
        width: 100%;
        height: 100%;
      }

      body {
        overflow: hidden;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
      }

      .pygodide-shell {
        margin: 0;
        padding: 0;
        width: 360px;
        height: 640px;
        flex-shrink: 0;
        position: relative;
      }

      .pygodide-stage {
        position: relative;
        margin: 0;
        padding: 0;
        width: 360px;
        height: 640px;
      }

      /* Контейнер загрузчика */
      #pygodide-loader {
        position: absolute;
        inset: 0;
        z-index: 3;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background-color: #050814;
        transition: opacity 300ms ease-out;
      }

      #pygodide-loader[data-state="hidden"] {
        opacity: 0;
        visibility: hidden;
      }

      /* Скрываем визуальные элементы */
      #pygodide-brand,
      #status,
      #pygodide-progress,
      #pygodide-progress-fill {
        opacity: 0 !important;
        pointer-events: none !important;
      }

      #pygodide-version {
        display: none !important;
      }

      #canvas {
        display: block;
        margin: 0;
        padding: 0;
        border: 0;
        background: #050814;
        width: 360px;
        height: 640px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      /* Поле ввода, которое лежит ровно поверх плашки в игре */
      #nickname-overlay {
        position: absolute;
        top: 280px;
        left: 50px;
        width: 260px;
        height: 50px;
        display: none; /* Показываем только когда нужно */
        z-index: 100;
      }

      #js-nickname-input {
        width: 100%;
        height: 100%;
        font-size: 24px;
        text-align: center;
        background: rgba(60, 60, 80, 0.6);
        border: 3px solid #d2b478;
        border-radius: 10px;
        color: #fff;
        outline: none;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <main class="pygodide-shell">
      <div class="pygodide-stage">
        <div id="pygodide-loader" data-state="active">
          <a id="pygodide-brand" href="#" aria-label="brand">
            <img src="./pygodide-logo.svg" alt="logo" />
          </a>
          <div id="status">Loading...</div>
          <div id="pygodide-progress" class="pygodide-progress">
            <span id="pygodide-progress-fill" class="pygodide-progress-fill"></span>
          </div>
        </div>
        <canvas
          id="canvas"
          data-canvas-layout="fixed"
          width="360"
          height="640"
          tabindex="0"
        ></canvas>

        <div id="nickname-overlay">
          <input type="text" id="js-nickname-input" maxlength="15" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/pyodide/v314.0.0/full/pyodide.js"></script>
    <script type="module" src="./boot.js?v=a6318f5a52fb"></script>

    <script>
      window.showNicknameInput = function() {
        const overlay = document.getElementById('nickname-overlay');
        const input = document.getElementById('js-nickname-input');
        overlay.style.display = 'block';
        input.focus();
      };

      window.hideNicknameInput = function() {
        document.getElementById('nickname-overlay').style.display = 'none';
      };

      document.getElementById('js-nickname-input').addEventListener('input', (e) => {
        window.currentNickname = e.target.value;
      });

      document.getElementById('js-nickname-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          window.confirmNicknameInPython();
        }
      });

      window.confirmNicknameInPython = function() {
        if (window.pyodide) {
          try {
            const gameClass = window.pyodide.globals.get('Game');
            if (gameClass && gameClass._instance && gameClass._instance.state === 'nickname') {
              const result = gameClass._instance.nickname_screen.confirm();
              if (result) {
                gameClass._instance.profile.nickname = result;
                gameClass._instance.profile.first_login = false;
                gameClass._instance.add_player_to_ranking();
                gameClass._instance.state = "main_menu";
              }
            }
          } catch (err) {
            console.error("Ошибка подтверждения:", err);
          }
        }
      };
    </script>
  </body>
</html>
